[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-pivot-chart-creator"
version = "0.1.0"
description = "Local desktop KPI pivot chart creator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.9.3,<6.10",
    "pyqtgraph>=0.13.7,<0.15",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
large-data = ["polars>=1.0", "duckdb>=1.0", "pyarrow>=16"]
parquet = ["pyarrow>=16"]
pdf = ["reportlab>=4"]
xlsb = ["pyxlsb>=1.0"]
build = ["pyinstaller>=6"]

[project.scripts]
kpi-pivot-chart-creator = "kpi_creator.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
